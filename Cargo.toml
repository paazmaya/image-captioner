[package]
name = "sesoko"
version = "0.1.0"
edition = "2021"
description = "Image captioning and content-aware cropping for martial arts imagery"
license = "MIT"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
repository = "https://github.com/jukka/sesoko"
keywords = ["image", "yolo", "captioning", "crop", "martial-arts"]
categories = ["multimedia::images", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "sesoko"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
image = "0.25.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.12"
walkdir = "2.5.0"
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tempfile = "3.27.0"
clap = { version = "4.6.0", features = ["derive"] }

[package.metadata.binstall]
# https://github.com/cargo-bins/cargo-binstall
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
